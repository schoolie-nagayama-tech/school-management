name: Integration Tests (RLS)

# RLS 回帰テストをローカル Supabase 環境で実行する。
# push/PR のたびに「講師は自教室のみ / 教室長は全件 / 匿名は不可」を自動検証する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: RLS Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Supabase CLI をセットアップ
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # クリーンビルドは base_schema のみを適用する。
      # 理由: migrations/ には無日付(xxx_)と日付(2026xxxx)が混在し、ファイル名順では
      # 依存テーブルのCREATEより先にALTERが走るためゼロからのクリーン適用が通らない。
      # base_schema は `npm run db:dump` で本番から再生成した現行スキーマ(全テーブル+適用済みRLS)
      # なので、これ一本で現行prod相当のDBが組める。増分SQLは一時退避して supabase start から除外する。
      # （supabase はサブディレクトリを読まないため _archived_for_local_dev も対象外）
      - name: Use base_schema only for clean build
        run: |
          mkdir -p /tmp/mig_excluded
          cd supabase/migrations
          find . -maxdepth 1 -name '*.sql' ! -name '00000000000000_base_schema.sql' \
            -exec mv {} /tmp/mig_excluded/ \;
          echo "適用するマイグレーション:" && ls *.sql

      # JWT署名鍵ファイルを使い捨てで生成する。
      # config.toml が signing_keys_path = "./signing_keys.json" を参照するが、
      # 実物（本番Supabaseが信頼するES256秘密鍵）はコミット禁止（.gitignore済み）。
      # CI ではファイルが「形式どおり存在する」ことだけが必要（このジョブが回すのは
      # スタッフ側RLSテストで、ポータルJWTの実鍵は使わない）ため、毎回その場で
      # ローカル実物と同形式（秘密JWKの配列）のダミー鍵を作る。
      - name: Generate throwaway signing keys
        run: |
          node -e '
            const { webcrypto: wc } = require("crypto");
            (async () => {
              const kp = await wc.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
              const jwk = await wc.subtle.exportKey("jwk", kp.privateKey);
              const out = [{ ...jwk, kid: wc.randomUUID(), use: "sig", alg: "ES256" }];
              require("fs").writeFileSync("supabase/signing_keys.json", JSON.stringify(out));
              console.log("generated throwaway signing key (kid=" + out[0].kid + ")");
            })();
          '

      # ローカル Supabase を起動（base_schema を適用してDBを初期化）
      # ubuntu-latest は Docker が利用可能なため supabase start が動く
      - name: Start Supabase
        run: supabase start

      # supabase status -o env の出力を .env.test に書き出す
      # キー名を .env.test の規約（NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY）に合わせる
      - name: Generate .env.test from supabase status
        run: |
          # supabase status -o env の出力例:
          #   ANON_KEY=eyJ...
          #   SERVICE_ROLE_KEY=eyJ...
          #   API_URL=http://127.0.0.1:54321
          #   DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          eval "$(supabase status -o env)"
          cat > .env.test <<EOF
          # 自動生成 — supabase status -o env より
          NEXT_PUBLIC_SUPABASE_URL=${API_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          DATABASE_URL=${DB_URL}
          EOF
          echo ".env.test を生成しました"
          # URL のみ確認（機密キーはログに出さない）
          grep NEXT_PUBLIC_SUPABASE_URL .env.test

      # RLS 回帰テストを実行（このワークフローの目的）。
      # schools/students の汎用CRUD統合テストは環境依存の既存課題があり別系統のため、
      # ここでは RLS 回帰スイートのみを対象にする（ローカルでは npm run test:integration で全体を実行可）。
      - name: Run RLS regression tests
        run: npx vitest run --config vitest.integration.config.ts src/__tests__/integration/rls-teacher-scope.test.ts

      # 後処理: 成功・失敗にかかわらず Supabase を停止
      - name: Stop Supabase
        if: always()
        run: supabase stop
